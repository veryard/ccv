name: 'Conventional Commits Versioning'
description: 'Provide a description here'
author: 'Brad'

# Define your inputs here.
inputs:
  token:
    description: GitHub Token
    required: true
  branch:
    description: The branch to fetch commit history from
    required: false
    default: main
  prefix:
    description: The prefix to use for the tag
    required: false
    default: v
  increment:
    description: Which version to increment (breaking, feat, fix, all)
    required: false
    default: all
  scan_body:
    description: Scan commit bodies for conventional markers (fixes promotion commits like "API: Staging -> Main" with bullet lists)
    required: false
    default: 'true'
  unknown_bump:
    description: What to do when there are only non-conventional changes (none, patch, minor, major). Only applies to increment=all.
    required: false
    default: none

# Define your outputs here.
outputs:
  bumped:
    description: Whether the version was bumped (true/false)
  old:
    description: The old version
  old_clean:
    description: The old version without prefix
  new:
    description: The new version
  new_clean:
    description: The new version without prefix
  changelogs:
    description: Markdown formatted changelogs
  changelogs_clean:
    description: Markdown formatted changelogs without the header
  changelogs_bbcode:
    description: BBCode formatted changelogs

runs:
  using: node20
  main: dist/index.js

branding:
  icon: activity
  color: blue
